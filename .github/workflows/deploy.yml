# Simple workflow for deploying static content to GitHub Pages
name: Deploy to GitHub Pages
on:
    # Runs on pushes targeting the default branch
    push:
        branches: ['main']
    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:
    # Called by release.yml to deploy the release commit
    workflow_call:
        inputs:
            ref:
                description: 'Commit to deploy'
                type: string
                default: ''
    # Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
    contents: read
    id-token: write
    pages: write
    deployments: write
# Allow one concurrent deployment
concurrency:
    group: 'pages'
    cancel-in-progress: true
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}
            - name: Resolve latest XRP_Firmware release
              id: firmware
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG=$(gh release view --repo Open-STEM/XRP_Firmware --json tagName --jq .tagName)
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "Using XRP_Firmware release $TAG"
            - name: Checkout firmware-loader content (XRP_Firmware)
              uses: actions/checkout@v4
              with:
                  # Pull the latest published release. To ship unreleased firmware, override
                  # repository/ref to a fork or branch.
                  repository: Open-STEM/XRP_Firmware
                  ref: ${{ steps.firmware.outputs.tag }}
                  path: xrp-firmware
            - name: Stage firmware-loader boards content
              run: |
                  rm -rf public/firmware-loader/boards
                  cp -r xrp-firmware/boards public/firmware-loader/boards
            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
            - name: Install dependencies
              run: npm install
            - name: test
              run: npm run test
            - name: Build
              run: npm run build
              env:
                  GOOGLE_AUTH_URL: ${{ vars.GOOGLE_AUTH_URL }}
                  GOOGLE_CHATAPI_PROXY_TARGET: ${{ vars.GOOGLE_CHATAPI_PROXY_TARGET }}
                  GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}

            - name: Upload pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  # Upload dist repository
                  path: './dist'
                  retention-days: 2

    # Deployment job
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
