# Checks that the PR title has a type (feat, fix, docs, ...) and that feat/fix PRs carry the
# English Change Log line the automatic release writes. Rules: scripts/release-lib.mjs.
name: PR title and Change Log
on:
    pull_request:
        types: [opened, edited, synchronize, reopened]
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Check the title and the Change Log lines
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_BODY: ${{ github.event.pull_request.body }}
              run: node scripts/release.mjs check
