<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Viewport check</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 15px system-ui; }
  #fixed { position: fixed; inset: 0; border-bottom: 6px solid red; box-sizing: border-box; }
  #dvh { position: fixed; top: 0; left: 0; width: 33%; height: 100dvh; border-bottom: 6px solid green; box-sizing: border-box; }
  #vv { position: fixed; top: 0; right: 0; width: 33%; border-bottom: 6px solid blue; box-sizing: border-box; }
  #safe { position: fixed; left: 0; right: 0; bottom: 0; height: env(safe-area-inset-bottom); background: orange; }
  pre { position: fixed; top: 20px; left: 10px; right: 10px; margin: 0; white-space: pre-wrap; z-index: 1; }
</style>
</head>
<body>
<div id="fixed"></div><div id="dvh"></div><div id="vv"></div><div id="safe"></div>
<pre id="out"></pre>
<script>
  if (location.search.includes('vh')) document.body.style.minHeight = '100vh';
  const probe = (css) => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:' + css; document.body.appendChild(d); const h = d.getBoundingClientRect().height; d.remove(); return Math.round(h); };
  function show() {
    const vv = window.visualViewport;
    document.getElementById('vv').style.height = vv.height + 'px';
    document.getElementById('out').textContent = [
      'innerHeight ' + innerHeight,
      'visualViewport ' + Math.round(vv.height) + ' (top ' + Math.round(vv.offsetTop) + ', scale ' + vv.scale + ')',
      'fixed inset:0 ' + Math.round(document.getElementById('fixed').getBoundingClientRect().height),
      '100dvh ' + probe('100dvh') + ' / 100svh ' + probe('100svh') + ' / 100lvh ' + probe('100lvh') + ' / 100vh ' + probe('100vh'),
      'safe-area bottom ' + probe('env(safe-area-inset-bottom)') + ', top ' + probe('env(safe-area-inset-top)'),
      'screen ' + screen.height + ', dpr ' + devicePixelRatio,
      '',
      'Bottom lines: red = fixed inset 0, green = 100dvh, blue = visualViewport, orange = safe area',
    ].join('\n');
  }
  show();
  visualViewport.addEventListener('resize', show);
  addEventListener('resize', show);
</script>
</body>
</html>
